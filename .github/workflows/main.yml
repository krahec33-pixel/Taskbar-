name: Vyrobit APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Stahnout repozitar
        uses: actions/checkout@v4

      - name: Vygenerovat Android projekt
        run: |
          mkdir -p app/src/main/java/com/pclauncher

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PCLauncher"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.pclauncher'
              compileSdk 34
              defaultConfig {
                  applicationId "com.pclauncher"
                  minSdk 26
                  targetSdk 28
                  versionCode 5
                  versionName "1.0.5"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.WRITE_SECURE_SETTINGS" />

              <application
                  android:label="PC Rozhraní"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:resizeableActivity="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:resizeableActivity="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|smallestScreenSize|density|fontScale|keyboard|keyboardHidden|navigation">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/pclauncher/MainActivity.kt
          package com.pclauncher

          import android.app.Activity
          import android.app.ActivityOptions
          import android.content.ComponentName
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Rect
          import android.graphics.Typeface
          import android.graphics.drawable.Drawable
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.Bundle
          import android.os.Process
          import android.provider.Settings
          import android.text.TextUtils
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.*
          import org.lsposed.hiddenapibypass.HiddenApiBypass

          data class AppItem(val label: String, val pkg: String, val activityName: String, val icon: Drawable)

          class MainActivity : Activity() {

              companion object {
                  var isPcSessionActive = false
                  var targetPcDpi = 220
              }

              private lateinit var startMenu: LinearLayout
              private lateinit var runningTasksBar: LinearLayout
              private lateinit var statusBadge: TextView
              private val recentApps = mutableListOf<AppItem>()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  // Odemknutí skrytých systémových metod Androidu (IWindowManager + Freeform)
                  if (Build.VERSION.SDK_INT >= 28) {
                      try {
                          HiddenApiBypass.addHiddenApiExemptions("L")
                      } catch (_: Throwable) {}
                  }

                  hideSystemBars()

                  // Okamžité přepnutí globálního rozlišení pro VŠECHNY aplikace
                  if (!isPcSessionActive) {
                      applyGlobalDensity(targetPcDpi)
                  }

                  buildDesktopUi()
              }

              private fun buildDesktopUi() {
                  val root = FrameLayout(this).apply {
                      setBackgroundColor(Color.parseColor("#0F172A"))
                  }

                  val desktopColumn = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(14), dp(14), dp(14), dp(14))
                  }

                  statusBadge = TextView(this).apply {
                      textSize = 11f
                      setTextColor(Color.WHITE)
                      setPadding(dp(12), dp(8), dp(12), dp(8))
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#1E293B"))
                          cornerRadius = dp(8).toFloat()
                          setStroke(dp(1), Color.parseColor("#3B82F6"))
                      }
                  }
                  updateStatusBadgeText()
                  desktopColumn.addView(statusBadge, LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT,
                      ViewGroup.LayoutParams.WRAP_CONTENT
                  ).apply { bottomMargin = dp(10) })

                  // Volič měřítka pro všechny aplikace v oknech
                  val scaleRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                  }

                  listOf(
                      180 to "🖥️ 180 DPI (Extra malé)",
                      220 to "🖥️ 220 DPI (PC Standard)",
                      260 to "🖥️ 260 DPI (Větší)"
                  ).forEach { (dpiVal, title) ->
                      val btn = Button(this).apply {
                          text = title
                          setTextColor(Color.WHITE)
                          textSize = 10f
                          background = GradientDrawable().apply {
                              setColor(if (targetPcDpi == dpiVal) Color.parseColor("#2563EB") else Color.parseColor("#334155"))
                              cornerRadius = dp(6).toFloat()
                          }
                          setPadding(dp(10), dp(6), dp(10), dp(6))
                          setOnClickListener {
                              targetPcDpi = dpiVal
                              applyGlobalDensity(dpiVal, showToast = true)
                              recreate()
                          }
                      }
                      scaleRow.addView(btn, LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      ).apply { rightMargin = dp(6) })
                  }

                  desktopColumn.addView(scaleRow, LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT,
                      ViewGroup.LayoutParams.WRAP_CONTENT
                  ).apply { bottomMargin = dp(10) })

                  val devBtn = Button(this).apply {
                      text = "⚙ Vývojářské možnosti"
                      setTextColor(Color.WHITE)
                      textSize = 10f
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#475569"))
                          cornerRadius = dp(6).toFloat()
                      }
                      setPadding(dp(10), dp(6), dp(10), dp(6))
                      setOnClickListener {
                          try {
                              startActivity(Intent(Settings.ACTION_APPLICATION_DEVELOPMENT_SETTINGS))
                          } catch (_: Exception) {
                              startActivity(Intent(Settings.ACTION_SETTINGS))
                          }
                      }
                  }
                  desktopColumn.addView(devBtn, LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT,
                      ViewGroup.LayoutParams.WRAP_CONTENT
                  ))

                  root.addView(desktopColumn, FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT,
                      ViewGroup.LayoutParams.WRAP_CONTENT,
                      Gravity.TOP or Gravity.START
                  ))

                  val watermark = TextView(this).apply {
                      text = "Android Desktop OS v1.0.5 (Global Window Scaling)\n" +
                             "Všechny otevírané aplikace nyní běží v jemné PC hustotě (${targetPcDpi} DPI)\n" +
                             "Klikni na ⊞ Start pro otevření aplikace v plovoucím okně"
                      setTextColor(Color.parseColor("#64748B"))
                      textSize = 14f
                      gravity = Gravity.CENTER
                      setTypeface(null, Typeface.BOLD)
                  }
                  root.addView(watermark, FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT,
                      ViewGroup.LayoutParams.WRAP_CONTENT,
                      Gravity.CENTER
                  ))

                  startMenu = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      visibility = View.GONE
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#F21E293B"))
                          cornerRadius = dp(10).toFloat()
                          setStroke(dp(1), Color.parseColor("#475569"))
                      }
                      setPadding(dp(14), dp(14), dp(14), dp(14))
                  }

                  val startTitle = TextView(this).apply {
                      text = "Aplikace (otevírají se v PC měřítku a plovoucím okně)"
                      setTextColor(Color.WHITE)
                      textSize = 12f
                      setTypeface(null, Typeface.BOLD)
                      setPadding(0, 0, 0, dp(10))
                  }
                  startMenu.addView(startTitle)

                  val apps = loadApps()
                  val grid = GridView(this).apply {
                      numColumns = 6
                      verticalSpacing = dp(10)
                      horizontalSpacing = dp(10)
                      adapter = object : BaseAdapter() {
                          override fun getCount() = apps.size
                          override fun getItem(p: Int) = apps[p]
                          override fun getItemId(p: Int) = p.toLong()
                          override fun getView(p: Int, v: View?, parent: ViewGroup?): View {
                              val app = apps[p]
                              return LinearLayout(this@MainActivity).apply {
                                  orientation = LinearLayout.VERTICAL
                                  gravity = Gravity.CENTER
                                  setPadding(dp(4), dp(4), dp(4), dp(4))
                                  addView(ImageView(this@MainActivity).apply {
                                      setImageDrawable(app.icon)
                                      layoutParams = LinearLayout.LayoutParams(dp(36), dp(36))
                                  })
                                  addView(TextView(this@MainActivity).apply {
                                      text = app.label
                                      setTextColor(Color.WHITE)
                                      textSize = 10f
                                      maxLines = 1
                                      ellipsize = TextUtils.TruncateAt.END
                                      gravity = Gravity.CENTER
                                  })
                                  setOnClickListener {
                                      startMenu.visibility = View.GONE
                                      launchFreeform(app, forceFreshDpi = true)
                                  }
                              }
                          }
                      }
                  }
                  startMenu.addView(grid, LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.MATCH_PARENT
                  ))

                  val startParams = FrameLayout.LayoutParams(dp(620), dp(360), Gravity.BOTTOM or Gravity.START).apply {
                      leftMargin = dp(10)
                      bottomMargin = dp(48)
                  }
                  root.addView(startMenu, startParams)

                  val taskbar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setBackgroundColor(Color.parseColor("#E6090D16"))
                      setPadding(dp(8), dp(4), dp(8), dp(4))
                  }

                  val startBtn = Button(this).apply {
                      text = "⊞ Start"
                      setTextColor(Color.WHITE)
                      textSize = 12f
                      setTypeface(null, Typeface.BOLD)
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#2563EB"))
                          cornerRadius = dp(6).toFloat()
                      }
                      setPadding(dp(14), 0, dp(14), 0)
                      setOnClickListener {
                          startMenu.visibility = if (startMenu.visibility == View.VISIBLE) View.GONE else View.VISIBLE
                      }
                  }
                  taskbar.addView(startBtn, LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, dp(32)))

                  runningTasksBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(10), 0, dp(10), 0)
                  }
                  taskbar.addView(runningTasksBar, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1f))

                  val clock = TextClock(this).apply {
                      format24Hour = "HH:mm  |  dd.MM."
                      setTextColor(Color.WHITE)
                      textSize = 12f
                      setPadding(dp(10), 0, dp(10), 0)
                  }
                  taskbar.addView(clock)

                  val exitBtn = Button(this).apply {
                      text = "⏻ Ukončit PC (Vrátit mobil)"
                      setTextColor(Color.WHITE)
                      textSize = 11f
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#DC2626"))
                          cornerRadius = dp(6).toFloat()
                      }
                      setPadding(dp(10), 0, dp(10), 0)
                      setOnClickListener { exitToNormalPhone() }
                  }
                  taskbar.addView(exitBtn, LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, dp(32)))

                  root.addView(taskbar, FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      dp(42),
                      Gravity.BOTTOM
                  ))

                  root.setOnClickListener { startMenu.visibility = View.GONE }
                  setContentView(root)
              }

              private fun updateStatusBadgeText() {
                  val actualSw = resources.configuration.smallestScreenWidthDp
                  val actualDpi = resources.displayMetrics.densityDpi
                  statusBadge.text = if (actualSw >= 600) {
                      "🟢 Globální PC rozlišení AKTIVNÍ: ${actualDpi} DPI (šířka ${actualSw} dp - okna jsou zmenšená)"
                  } else {
                      "🟠 Systém stále běží v mobilním rozlišení (${actualDpi} DPI / ${actualSw} dp)"
                  }
              }

              // Skutečná změna DPI přes WindowManagerService pro všechny aplikace v oknech
              private fun applyGlobalDensity(dpi: Int, showToast: Boolean = false) {
                  isPcSessionActive = true
                  try {
                      Settings.Secure.putString(contentResolver, "display_density_forced", dpi.toString())

                      val wmClass = Class.forName("android.view.WindowManagerGlobal")
                      val getWmService = wmClass.getDeclaredMethod("getWindowManagerService")
                      getWmService.isAccessible = true
                      val iWm = getWmService.invoke(null)

                      if (iWm != null) {
                          val userId = Process.myUid() / 100000
                          try {
                              val m = iWm.javaClass.getMethod(
                                  "setForcedDisplayDensityForUser",
                                  Int::class.javaPrimitiveType,
                                  Int::class.javaPrimitiveType,
                                  Int::class.javaPrimitiveType
                              )
                              m.invoke(iWm, 0, dpi, userId)
                          } catch (_: NoSuchMethodException) {
                              val mAlt = iWm.javaClass.getMethod(
                                  "setForcedDisplayDensity",
                                  Int::class.javaPrimitiveType,
                                  Int::class.javaPrimitiveType
                              )
                              mAlt.invoke(iWm, 0, dpi)
                          }
                      }
                      if (showToast) {
                          Toast.makeText(this, "Rozlišení všech aplikací nastaveno na $dpi DPI", Toast.LENGTH_SHORT).show()
                      }
                  } catch (e: Exception) {
                      if (showToast) {
                          Toast.makeText(this, "Chyba změny DPI: ${e.message}", Toast.LENGTH_LONG).show()
                      }
                  }
              }

              private fun restoreNormalResolution() {
                  isPcSessionActive = false
                  try {
                      Settings.Secure.putString(contentResolver, "display_density_forced", null)

                      val wmClass = Class.forName("android.view.WindowManagerGlobal")
                      val getWmService = wmClass.getDeclaredMethod("getWindowManagerService")
                      getWmService.isAccessible = true
                      val iWm = getWmService.invoke(null)

                      if (iWm != null) {
                          val userId = Process.myUid() / 100000
                          try {
                              val m = iWm.javaClass.getMethod(
                                  "clearForcedDisplayDensityForUser",
                                  Int::class.javaPrimitiveType,
                                  Int::class.javaPrimitiveType
                              )
                              m.invoke(iWm, 0, userId)
                          } catch (_: NoSuchMethodException) {
                              val mAlt = iWm.javaClass.getMethod(
                                  "clearForcedDisplayDensity",
                                  Int::class.javaPrimitiveType
                              )
                              mAlt.invoke(iWm, 0)
                          }
                      }
                  } catch (_: Exception) {}
              }

              private fun exitToNormalPhone() {
                  restoreNormalResolution()
                  val samsungHome = packageManager.getLaunchIntentForPackage("com.sec.android.app.launcher")
                  if (samsungHome != null) {
                      startActivity(samsungHome)
                  }
                  finish()
              }

              override fun onConfigurationChanged(newConfig: android.content.res.Configuration) {
                  super.onConfigurationChanged(newConfig)
                  buildDesktopUi()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  if (isFinishing) {
                      restoreNormalResolution()
                  }
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) {
                      hideSystemBars()
                      if (::statusBadge.isInitialized) updateStatusBadgeText()
                  }
              }

              @Suppress("DEPRECATION")
              private fun hideSystemBars() {
                  window.decorView.systemUiVisibility = (
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      or View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      or View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      or View.SYSTEM_UI_FLAG_FULLSCREEN
                  )
              }

              private fun loadApps(): List<AppItem> {
                  val pm = packageManager
                  val intent = Intent(Intent.ACTION_MAIN, null).apply {
                      addCategory(Intent.CATEGORY_LAUNCHER)
                  }
                  return pm.queryIntentActivities(intent, 0).mapNotNull { info ->
                      val pkg = info.activityInfo.packageName
                      val actName = info.activityInfo.name
                      if (pkg == packageName || pkg == "com.sec.android.app.launcher") return@mapNotNull null
                      AppItem(info.loadLabel(pm).toString(), pkg, actName, info.loadIcon(pm))
                  }.sortedBy { it.label.lowercase() }
              }

              private fun launchFreeform(app: AppItem, forceFreshDpi: Boolean) {
                  val intent = Intent(Intent.ACTION_MAIN).apply {
                      addCategory(Intent.CATEGORY_LAUNCHER)
                      component = ComponentName(app.pkg, app.activityName)
                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_MULTIPLE_TASK)
                      if (forceFreshDpi) {
                          addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP or Intent.FLAG_ACTIVITY_CLEAR_TASK)
                      }
                  }

                  val dm = resources.displayMetrics
                  val w = dm.widthPixels
                  val h = dm.heightPixels
                  val offset = (recentApps.size % 5) * dp(22)
                  val bounds = Rect(
                      (w * 0.10f).toInt() + offset,
                      (h * 0.06f).toInt() + offset,
                      (w * 0.74f).toInt() + offset,
                      (h * 0.84f).toInt() + offset
                  )

                  val options = ActivityOptions.makeBasic()
                  options.launchBounds = bounds

                  try {
                      val m = ActivityOptions::class.java.getMethod("setLaunchWindowingMode", Int::class.javaPrimitiveType)
                      m.invoke(options, 5)
                  } catch (_: Exception) {}

                  val bundle = options.toBundle()
                  bundle.putInt("android.activity.launchWindowingMode", 5)

                  try {
                      startActivity(intent, bundle)
                  } catch (e: Exception) {
                      Toast.makeText(this, "Chyba: ${e.message}", Toast.LENGTH_SHORT).show()
                  }

                  if (recentApps.none { it.pkg == app.pkg }) {
                      recentApps.add(app)
                      val iconBtn = ImageView(this).apply {
                          setImageDrawable(app.icon)
                          setPadding(dp(4), dp(4), dp(4), dp(4))
                          layoutParams = LinearLayout.LayoutParams(dp(32), dp(32)).apply { rightMargin = dp(6) }
                          setOnClickListener { launchFreeform(app, forceFreshDpi = false) }
                      }
                      runningTasksBar.addView(iconBtn)
                  }
              }

              private fun dp(value: Int): Int = (value * resources.displayMetrics.density).toInt()
          }
          EOF

      - name: Nastavit Javu 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Nastavit Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Zkompilovat APK
        run: gradle assembleDebug

      - name: Vystavit APK primo v Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "PC Rozhraní v1.0.${{ github.run_number }}"
          files: app/build/outputs/apk/debug/app-debug.apk
